# kits/hollow.toml (apx-gen H1b): per-level encounter tables (D75), haven trades (D73) and set
# pieces (gameplay/20 sections 2.1 and 6). Kinds are Barony monster types listed WEAKEST FIRST;
# weights are spawn shares. A kind's tier is the band its cumulative share starts in: under 60
# percent fodder, then regular to 90, elite to 98, champion (D75: the weakest types, about 60
# percent of a floor's spawns, are fodder; floor 1 rats and skeletons are fodder).
# Content rows (names, text) live in barony-apx data/apx/hollow; the ids match.

