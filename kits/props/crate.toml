# kits/props/crate.toml (apx-gen F3 prop grammar, generated by tools/gen_dress_kits.py): a planked crate; variants scale it
[meta]
id = "crate"
footprint = [1, 1]
support = "floor"
blocks = true
content = "container"
variants = 3
dims = ["10+v*2", "10+v*2", "10+v*2"]
palette = [[20, 12, 6], [30, 18, 9], [40, 26, 13], [18, 18, 20], [44, 8, 8], [10, 14, 36], [60, 26, 4], [63, 54, 12], [22, 21, 20], [36, 35, 33], [50, 46, 38], [60, 60, 58], [40, 42, 46], [14, 30, 12]]

[[part]]
op = "box"
from = [0, 0, 0]
to = ["w", "d", "h"]
color = 1

[[part]]
op = "repeat"
from = 0
to = "h"
step = 3
parts = [
  { op = "paint", from = [0, 0, "i"], to = ["w", "d", "i+1"], color = 0 },
]

[[part]]
op = "paint"
from = [0, 0, "h-1"]
to = ["w", "d", "h"]
color = 2

[[part]]
op = "paint"
from = [0, 0, 0]
to = [1, 1, "h"]
color = 0

[[part]]
op = "paint"
from = ["w-1", "d-1", 0]
to = ["w", "d", "h"]
color = 0
